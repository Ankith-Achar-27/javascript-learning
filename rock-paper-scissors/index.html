<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style/rock-paper-scissor.css">
</head>

<body>
    <p class="title">Rock Paper Scissors</p>
    <button onClick="playerGame('rock') " class="move-button">
        <img src="assets\rock-emoji.png" alt="rock hand emoji" class="move-icon">
    </button>

    <button onClick="playerGame('paper')" class="move-button">
        <img src="assets\paper-emoji.png" alt="paper hand emoji" class="move-icon">
    </button>

    <button onClick="playerGame('scissors')" class="move-button">
        <img src="assets\scissors-emoji.png" alt="scissors hand emoji" class="move-icon">
    </button>


    <p class="js-result result"></p>
    <p class="js-moves"></p>

    <p class="js-score score"></p>





    <button onClick="resetScore()" class="reset-score-button">Reset Score</button>

    <button onClick="autoPLay();" class="js-autoplay auto-play-button"> Auto Play</button>
    <script src="script/rock-paper-scissor.js"></script>
</body>

</html>
