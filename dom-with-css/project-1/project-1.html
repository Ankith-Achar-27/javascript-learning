<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Projects</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <p>YouTube Subscribe Button</p>
    <button onClick="subscribe()" class="js-subscribe-button subscribe-button">
        Subscribe
    </button>

    <p>Amazon Shipping Calculator</p>
    <p>Order under Rs100 = Order + Rs50 Shipping</p>
    <p>Order over Rs100 = Free Shipping</p>

    <input placeholder="Cost of order" onkeydown="handleKeyDown(event)" class="js-cost-input cost-input">

    <button onClick="calculateTotal();" class="calculate-button">Calculate</button>
    <p class="js-total-cost"></p>

    <!--  There are spaces befor and after Subscribe -->
    <script src="script.js"></script>
</body>

</html>
